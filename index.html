<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversor XYZ</title>
  <link rel="stylesheet" href="estilos.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1b1f23">
  <link rel="icon" href="icono-192.png">
  <link rel="apple-touch-icon" href="icono-192.png">
</head>
<body>
  <header>
    <h1>Conversor XYZ → AutoCAD</h1>
    <p>Topcon GTS · Civil 3D (PNEZD)</p>
  </header>

  <main>
    <label class="selector">
      <strong>📂 Toca para elegir archivo</strong>
      <span>Archivo .xyz o .raw de la estación</span>
      <input type="file" id="archivo" accept=".xyz,.raw,.txt">
    </label>

    <p id="estado"></p>

    <div class="botones">
      <button id="btnCSV" disabled>Descargar CSV (PNEZD)</button>
      <button id="btnTXT" class="secundario" disabled>Descargar TXT (PNEZ)</button>
      <button id="btnCompartir" class="secundario" disabled hidden>Compartir CSV (WhatsApp, correo…)</button>
    </div>

    <section class="envio" id="seccionEnvio" hidden>
      <h2>Enviar a la oficina</h2>
      <label>Equipo
        <select id="equipo">
          <option value="EST-01">EST-01 · Estación Topcon</option>
          <option value="GNSS-01">GNSS-01 · AllyNav R26</option>
          <option value="GNSS-02">GNSS-02 · AllyNav R90</option>
        </select>
      </label>
      <label>Proyecto
        <input id="proyecto" placeholder="Ej.: P01" autocomplete="off">
      </label>
      <label>Fecha y hora de la captura
        <input id="fechaCaptura" type="datetime-local">
      </label>
      <button id="btnEnviar">Enviar a la oficina</button>
    </section>

    <p id="estadoEnvio"></p>

    <div class="tabla-caja" id="cajaTabla" hidden>
      <table id="tabla">
        <thead>
          <tr><th>Punto</th><th>Norte</th><th>Este</th><th>Cota</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <details class="config" id="registroSolo">
      <summary>📋 Registrar escaneo LiDAR o sesión GNSS estática</summary>
      <p class="nota">Solo se registran los datos básicos. El archivo se procesa en la oficina.</p>
      <label>Equipo
        <select id="rsEquipo">
          <option value="LID-01">LID-01 · Escáner LiDAR</option>
          <option value="GNSS-01">GNSS-01 · AllyNav R26 (estático)</option>
          <option value="GNSS-02">GNSS-02 · AllyNav R90 (estático)</option>
        </select>
      </label>
      <label>Proyecto
        <input id="rsProyecto" placeholder="Ej.: P01" autocomplete="off">
      </label>
      <label>Nombre del archivo en el equipo
        <input id="rsArchivo" placeholder="Ej.: 064408071855.DAT" autocomplete="off">
      </label>
      <label>Fecha y hora de la captura
        <input id="rsFecha" type="datetime-local">
      </label>
      <label>Observaciones (opcional)
        <input id="rsObs" autocomplete="off">
      </label>
      <button id="btnRegistrar">Registrar y enviar</button>
    </details>

    <details class="config">
      <summary>⚙ Configurar envío</summary>
      <label>URL del receptor
        <input id="cfgUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec">
      </label>
      <label>Clave
        <input id="cfgClave" type="password" autocomplete="off">
      </label>
      <button id="btnGuardarCfg" class="secundario">Guardar configuración</button>
    </details>
  </main>

  <script src="parser.js"></script>
  <script src="exportar.js"></script>
  <script src="envio.js"></script>
  <script>
    let puntosActuales = [];
    let nombreBase = "puntos";
    let archivoActual = null;
    let horaConversion = null;

    const btnCSV = document.getElementById("btnCSV");
    const btnTXT = document.getElementById("btnTXT");
    const btnCompartir = document.getElementById("btnCompartir");
    const estado = document.getElementById("estado");

    // Mostrar "Compartir" solo si el celular lo permite
    const puedeCompartir = navigator.canShare &&
      navigator.canShare({ files: [new File(["x"], "x.csv", { type: "text/csv" })] });
    btnCompartir.hidden = !puedeCompartir;

    document.getElementById("archivo").addEventListener("change", function (e) {
      const archivo = e.target.files[0];
      if (!archivo) return;

      const lector = new FileReader();
      lector.onload = function () {
        puntosActuales = parsearXYZ(lector.result);
        archivoActual = archivo;
        horaConversion = new Date();
        document.getElementById("fechaCaptura").value = fechaLocal(horaConversion);
        nombreBase = archivo.name.replace(/\.[^.]+$/, "").trim();

        const hayPuntos = puntosActuales.length > 0;
        estado.textContent = hayPuntos
          ? "✅ " + archivo.name + ": " + puntosActuales.length + " puntos leídos"
          : "⚠️ " + archivo.name + ": no se encontraron puntos";
        estado.className = hayPuntos ? "ok" : "";

        btnCSV.disabled = btnTXT.disabled = btnCompartir.disabled = !hayPuntos;
        document.getElementById("cajaTabla").hidden = !hayPuntos;
        document.getElementById("seccionEnvio").hidden = !hayPuntos;

        const cuerpo = document.querySelector("#tabla tbody");
        cuerpo.innerHTML = "";
        for (const p of puntosActuales) {
          const codigo = p.descripcion
            ? "<br><small class='codigo'>" + p.descripcion.replace(/[<>&]/g, "") + "</small>"
            : "";
          cuerpo.innerHTML += "<tr><td>" + p.punto + codigo + "</td><td>" + p.norte.toFixed(3) +
            "</td><td>" + p.este.toFixed(3) + "</td><td>" + p.cota.toFixed(3) + "</td></tr>";
        }
      };
      lector.readAsText(archivo, "ISO-8859-1");
    });

    btnCSV.addEventListener("click", function () {
      descargar(nombreBase + ".csv", generarCSV(puntosActuales));
    });

    btnTXT.addEventListener("click", function () {
      descargar(nombreBase + ".txt", generarTXT(puntosActuales));
    });

    btnCompartir.addEventListener("click", async function () {
      const archivo = new File([generarCSV(puntosActuales)], nombreBase + ".csv", { type: "text/csv" });
      try {
        await navigator.share({ files: [archivo], title: nombreBase + ".csv" });
      } catch (err) {
        // El usuario canceló: no hacer nada
      }
    });

    // ----- Envío a la oficina -----
    const estadoEnvio = document.getElementById("estadoEnvio");
    const inputProyecto = document.getElementById("proyecto");
    const selectEquipo = document.getElementById("equipo");

    function mostrarEstadoEnvio(r) {
      if (r.error && r.error !== "sin señal") {
        estadoEnvio.textContent = "⚠️ " + r.error + (r.pendientes ? " · Pendientes: " + r.pendientes : "");
      } else if (r.pendientes > 0) {
        estadoEnvio.textContent = "📶 Sin señal: " + r.pendientes + " envío(s) pendiente(s). Se enviarán solos al recuperar la conexión.";
      } else if (r.enviados > 0) {
        estadoEnvio.textContent = "✅ Enviado a la oficina (" + r.enviados + ")";
      } else {
        estadoEnvio.textContent = "";
      }
    }

    // Fecha en formato del campo datetime-local (hora del celular)
    function fechaLocal(d) {
      const dos = n => String(n).padStart(2, "0");
      return d.getFullYear() + "-" + dos(d.getMonth() + 1) + "-" + dos(d.getDate()) +
        "T" + dos(d.getHours()) + ":" + dos(d.getMinutes());
    }

    // Solo muestra el estado si había algo pendiente o enviado
    function mostrarSiHayAlgo(r) {
      if (r.enviados > 0 || r.pendientes > 0) mostrarEstadoEnvio(r);
    }

    // Recordar el último equipo y proyecto usados
    const ultimo = leerLocal("conversorxyz.ultimo", { equipo: "EST-01", proyecto: "" });
    selectEquipo.value = ultimo.equipo;
    inputProyecto.value = ultimo.proyecto;

    document.getElementById("btnEnviar").addEventListener("click", function () {
      const proyecto = inputProyecto.value.trim().toUpperCase();
      if (!proyecto) {
        estadoEnvio.textContent = "⚠️ Escribe el proyecto antes de enviar.";
        return;
      }
      guardarLocal("conversorxyz.ultimo", { equipo: selectEquipo.value, proyecto: proyecto });
      // Algunos Android entregan el archivo sin extensión: se deduce por el contenido
      const extension = (archivoActual.name.trim().match(/\.[^.]+$/) || [""])[0].toLowerCase() ||
        (puntosActuales.some(p => p.alturaPrisma !== undefined) ? ".raw" : ".xyz");
      encolar({
        registro: {
          fecha_captura: new Date(document.getElementById("fechaCaptura").value || horaConversion).toISOString(),
          fecha_conversion: horaConversion.toISOString(),
          id_equipo: selectEquipo.value,
          id_proyecto: proyecto,
          archivo_origen: archivoActual.name,
          formato: extension,
          tipo_registro: "Convertido",
          puntos: puntosActuales.length,
          origen: "Archivo en celular"
        },
        archivo: { nombre: nombreBase + ".csv", contenido: generarCSV(puntosActuales) }
      });
      estadoEnvio.textContent = "⏳ Enviando…";
      procesarCola(mostrarEstadoEnvio);
    });

    // ----- Registro de LiDAR o GNSS estático (sin archivo) -----
    document.getElementById("registroSolo").addEventListener("toggle", function () {
      const f = document.getElementById("rsFecha");
      if (this.open && !f.value) f.value = fechaLocal(new Date());
    });

    document.getElementById("btnRegistrar").addEventListener("click", function () {
      const equipo = document.getElementById("rsEquipo").value;
      const proyecto = document.getElementById("rsProyecto").value.trim().toUpperCase();
      const nombre = document.getElementById("rsArchivo").value.trim();
      const fecha = document.getElementById("rsFecha").value;
      if (!proyecto || !nombre || !fecha) {
        estadoEnvio.textContent = "⚠️ Completa proyecto, nombre del archivo y fecha.";
        estadoEnvio.scrollIntoView({ behavior: "smooth", block: "center" });
        return;
      }
      const extension = (nombre.match(/\.[^.]+$/) || [""])[0] || (equipo === "LID-01" ? ".las" : ".DAT");
      const ahora = new Date();
      encolar({
        registro: {
          fecha_captura: new Date(fecha).toISOString(),
          fecha_conversion: ahora.toISOString(),
          id_equipo: equipo,
          id_proyecto: proyecto,
          archivo_origen: nombre,
          formato: extension,
          tipo_registro: "Solo registro",
          puntos: "",
          origen: "Registro manual en app",
          observaciones: document.getElementById("rsObs").value.trim() || "Archivo procesado en oficina"
        },
        archivo: null
      });
      document.getElementById("rsArchivo").value = "";
      document.getElementById("rsObs").value = "";
      document.getElementById("rsFecha").value = "";
      document.getElementById("registroSolo").open = false;
      estadoEnvio.textContent = "⏳ Enviando…";
      estadoEnvio.scrollIntoView({ behavior: "smooth", block: "center" });
      procesarCola(mostrarEstadoEnvio);
    });

    // Configuración (una sola vez por celular)
    const config = leerConfig();
    document.getElementById("cfgUrl").value = config.url;
    document.getElementById("cfgClave").value = config.clave;
    document.getElementById("btnGuardarCfg").addEventListener("click", function () {
      const ok = guardarConfig(document.getElementById("cfgUrl").value, document.getElementById("cfgClave").value);
      estadoEnvio.textContent = ok ? "✅ Configuración guardada" : "⚠️ No se pudo guardar la configuración";
      procesarCola(mostrarSiHayAlgo);
    });

    // Reintentar lo pendiente al abrir la app y al volver la señal
    window.addEventListener("online", function () { procesarCola(mostrarSiHayAlgo); });
    procesarCola(mostrarSiHayAlgo);

    // Registrar el service worker (modo sin internet)
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>
</body>
</html>
